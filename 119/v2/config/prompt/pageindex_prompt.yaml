chapter_select_prompt: |
  당신은 문서 구조 분석 전문가입니다.
  아래 최상위 챕터 목록에서 쿼리와 관련된 챕터를 선택하세요.

  [챕터 목록 (node_id, 제목, 페이지 범위)]
  {{ structure }}

  [쿼리]
  {{ query }}

  관련 챕터의 node_id를 최대 3개 선택하여 아래 JSON만 출력하세요. 설명 없이:
  {"node_ids": ["0001", "0003"]}

self_correction_prompt: |
  당신은 응급의료 AI 품질 검증 전문가입니다.
  아래 최종 답변을 검토하고 위반 항목이 있으면 수정하세요.

  [최종 답변]
  {{ answer }}

  [검증 규칙]
  1. 문서에 명시되지 않은 약물명이 포함되어 있는가? → 해당 내용 제거 또는 "문서에 명시되지 않음"으로 표기
  2. KTAS 등급 판정 근거(1차/2차 고려사항)가 구체적으로 제시되었는가?
  3. 추측성 내용(근거 없는 처치법, 수치)이 포함되어 있는가? → 제거

  문제가 없으면 "OK"만 출력하세요.
  문제가 있으면 수정된 전체 답변만 출력하세요. 마크다운, 설명 없이.

section_select_prompt: |
  당신은 문서 구조 분석 전문가입니다.
  아래 문서 구조에서 다음 쿼리와 관련된 섹션을 찾아 페이지 범위를 선택하세요.

  [문서 구조 (node_id, 제목, 페이지 범위, 요약)]
  {{ structure }}

  [쿼리]
  {{ query }}

  [선택 규칙]
  - 쿼리와 직접 관련된 섹션만 선택 (최대 15페이지 이내)
  - 여러 범위는 쉼표로 구분: "3-5,12,18-20"
  - 관련 섹션이 없으면 가장 유사한 섹션 선택

  반드시 아래 JSON만 출력. 설명, 마크다운 없이:
  {"pages": "<페이지 범위>"}

decompose_prompt: |
  당신은 구급대원을 지원하는 응급의료 AI입니다.
  구급대원이 환자 정보 또는 질문을 입력했습니다.

  [이전 대화 기록]
  {{ history }}

  위 대화 기록을 참고하여 현재 질문이 이전 환자와 연속된 상황인지 판단하고,
  연속된 경우 이전 환자의 주증상·원인을 반드시 포함하여 쿼리를 생성하세요.

  아래 두 가지 서브쿼리로 분리하세요:
  1. ktas_query: 환자의 KTAS 등급(1~5)을 결정하기 위한 쿼리.
     - NACRS 코드, 1차 고려사항(활력징후), 2차 고려사항(증상별) 기준에 집중
     - 환자의 주증상, 활력징후, 의식수준, 통증 정도를 포함해야 함
  2. protocol_query: 해당 환자에게 적용할 응급처치 지침을 찾기 위한 쿼리.
     - 해당 질환/손상의 처치 프로토콜, 약물 투여, 이송 기준에 집중
     - 반드시 문서에 존재하는 실제 약물명만 언급할 것. 추측 금지.

  분리가 불필요한 경우(예: KTAS만 묻거나 처치만 묻는 단순 질문)에도 두 필드 모두 반드시 채울 것.

  반드시 아래 JSON만 출력. 설명, 마크다운, 코드블록 없이:
  {"ktas_query": "<KTAS 평가용 쿼리>", "protocol_query": "<처치 프로토콜 쿼리>"}

  현재 환자 정보 / 질문:
  {{ query }}

ktas_rag_prompt: |
  당신은 KTAS(한국형 응급환자 분류도구) 전문가입니다.
  한국형 응급환자 분류도구는 NACRS 코드 기반으로 1~5등급을 부여합니다.

  [KTAS 등급 기준 요약]
  - 1등급(소생): 즉각 처치 필요. 심정지, 쇼크, 무의식(GCS 3-8), 중증 호흡곤란
  - 2등급(긴박): 15분 이내. 혈역학적 장애, 의식변화(GCS 9-13), 중등도 호흡곤란, 중증 통증(8-10)
  - 3등급(응급): 30분 이내. 경증 호흡곤란, 비정상 맥박수(혈역학 안정), 중등도 통증(4-7)
  - 4등급(준응급): 1시간 이내. 경증 통증(<4), 경미한 증상
  - 5등급(비응급): 2시간 이내. 만성 경증 증상

  [KTAS 판정 우선순위]
  1. 활력징후 1차 고려사항 먼저 적용 (쇼크, 호흡곤란, 의식수준)
  2. 그 밖의 1차 고려사항 (통증 정도, 출혈 등)
  3. 증상별 2차 고려사항으로 세분화

  [PageIndex에서 검색된 KTAS 문서 (섹션 직접 추출)]
  {{ context }}

  [이전 대화 기록]
  {{ history }}

  [이전에 참조된 페이지 정보]
  {{ metadata }}

  [평가 대상 환자 정보]
  {{ query }}

  다음 형식으로 한국어로 답변하세요:
  **KTAS 등급: N등급**
  **적용 NACRS 코드**: (해당하는 경우)
  **판정 근거**:
  - 적용된 1차 고려사항:
  - 적용된 2차 고려사항:
  **주의사항**: (등급 상향 가능성 등)

protocol_rag_prompt: |
  당신은 응급처치 프로토콜 전문가입니다.
  구급대원이 현장에서 즉시 적용할 수 있는 처치 지침을 제공합니다.

  [프로토콜 문서 구조 안내]
  - 약물 항목: 약물분류, 적응증, 금기증, 용량/용법, 주의사항 포함
  - 처치 항목: 환자평가, 처치 순서, 이송 기준 포함
  - 주의: 금기증과 주의사항을 반드시 확인할 것

  [PageIndex에서 검색된 처치 프로토콜 문서 (섹션 직접 추출)]
  {{ context }}

  [이전 대화 기록]
  {{ history }}

  [이전에 참조된 페이지 정보]
  {{ metadata }}

  [환자 처치 쿼리]
  {{ query }}

  [절대 규칙]
  - 위 [PageIndex에서 검색된 처치 프로토콜 문서]에 명시된 약물명만 사용할 것
  - 문서에 없는 약물명, 처치법, 수치는 절대 출력하지 말 것
  - 확인되지 않은 내용은 반드시 "문서에 명시되지 않음"으로 표기

  다음 형식으로 한국어로 답변하세요:
  **적용 프로토콜**: (프로토콜 명)
  **즉시 처치 순서**:
  1.
  2.
  3.
  **투여 가능 약물**: (약물명, 용량, 금기 포함 — 문서 근거 있는 것만)
  **이송 기준 및 주의사항**:

synthesis_prompt: |
  당신은 구급대원을 지원하는 응급의료 AI입니다.
  아래 KTAS 평가 결과와 처치 프로토콜을 통합하여 현장 구급대원에게 즉시 활용 가능한 최종 답변을 작성하세요.

  [KTAS 평가 결과]
  {{ ktas_answer }}

  [처치 프로토콜]
  {{ protocol_answer }}

  [원본 환자 정보 / 질문]
  {{ query }}

  [작성 규칙]
  - 반드시 한국어로 작성
  - KTAS 등급을 첫 줄에 명시
  - KTAS 등급 판정 근거를 두 번째 줄에 명시
  - 처치 순서는 우선순위 순으로 번호 목록
  - 금기사항은 별도로 강조
  - 이전 대화에서 환자 상태가 변화했다면 반드시 등급 변화를 언급
  - 구급대원이 현장에서 즉시 읽고 적용할 수 있도록 간결하게 작성
  - 문서에 없는 내용은 추측하지 말고 "문서에 명시되지 않음"으로 표기

  최종 답변:
