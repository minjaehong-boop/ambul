<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage RAG Playground</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-bg: #202123;
      --sidebar-hover: #2a2a2b;
      --sidebar-active: #343541;
      --sidebar-border: #2d2d2f;
      --sidebar-text: #c5c5d2;
      --sidebar-muted: #8e8ea0;
      --main-bg: #fff;
      --msg-border: #e5e7eb;
      --user-bubble: #f3f4f6;
      --accent: #111827;
      --accent-hover: #374151;
      --input-border: #d1d5db;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      font-family: var(--font);
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: var(--main-bg);
      color: var(--accent);
      font-size: 14px;
    }

    /* ──────────────── SIDEBAR ──────────────── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--sidebar-border);
    }

    .sidebar-top {
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--sidebar-border);
    }

    .app-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
    }

    .app-sub {
      font-size: 11px;
      color: var(--sidebar-muted);
      margin-top: 2px;
    }

    /* Server selector */
    .server-block {
      padding: 10px 12px;
      border-bottom: 1px solid var(--sidebar-border);
    }

    .block-label {
      font-size: 10px;
      color: var(--sidebar-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }

    .server-block select,
    .server-block input[type="text"] {
      width: 100%;
      background: #2a2a2b;
      color: var(--sidebar-text);
      border: 1px solid #3a3a3d;
      border-radius: 5px;
      padding: 6px 9px;
      font-size: 12px;
      font-family: var(--font);
      outline: none;
      cursor: pointer;
    }

    .server-block input[type="text"] {
      margin-top: 5px;
      cursor: text;
    }

    .server-block select:focus,
    .server-block input:focus { border-color: #555; }

    .health-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 6px;
    }

    .health-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .health-dot.ok  { background: #22c55e; }
    .health-dot.err { background: #ef4444; }

    .health-label {
      font-size: 11px;
      color: var(--sidebar-muted);
    }

    /* New chat */
    #new-chat-btn {
      margin: 10px 12px 6px;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid #3a3a3d;
      border-radius: 6px;
      color: var(--sidebar-text);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.12s;
    }
    #new-chat-btn:hover { background: var(--sidebar-hover); }

    /* Conversation list */
    .conv-section-label {
      padding: 10px 12px 3px;
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #conv-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 6px;
    }

    #conv-list::-webkit-scrollbar { width: 4px; }
    #conv-list::-webkit-scrollbar-thumb { background: #3a3a3d; border-radius: 2px; }

    .conv-date-label {
      padding: 7px 6px 3px;
      font-size: 10px;
      color: #4a4a4e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .conv-item {
      display: flex;
      align-items: center;
      padding: 8px 9px;
      border-radius: 6px;
      cursor: pointer;
      gap: 6px;
      transition: background 0.1s;
    }
    .conv-item:hover { background: var(--sidebar-hover); }
    .conv-item.active { background: var(--sidebar-active); }

    .conv-item-title {
      flex: 1;
      font-size: 13px;
      color: var(--sidebar-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-item-server {
      font-size: 10px;
      color: #555;
      flex-shrink: 0;
    }

    .conv-del {
      opacity: 0;
      background: none;
      border: none;
      color: #666;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
      border-radius: 3px;
      transition: opacity 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .conv-item:hover .conv-del { opacity: 1; }
    .conv-del:hover { color: #ef4444; }

    /* Sidebar footer */
    .sidebar-footer {
      padding: 10px 12px;
      border-top: 1px solid var(--sidebar-border);
      display: flex;
      gap: 6px;
    }

    .export-btn {
      flex: 1;
      padding: 7px 4px;
      background: transparent;
      border: 1px solid #3a3a3d;
      border-radius: 5px;
      color: var(--sidebar-muted);
      font-size: 11px;
      font-family: var(--font);
      cursor: pointer;
      text-align: center;
      transition: background 0.12s, color 0.12s;
    }
    .export-btn:hover { background: var(--sidebar-hover); color: var(--sidebar-text); }

    /* ──────────────── MAIN ──────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    /* Chat header */
    #chat-header {
      padding: 13px 24px;
      border-bottom: 1px solid var(--msg-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 50px;
    }

    #chat-title {
      font-size: 14px;
      font-weight: 500;
      color: #9ca3af;
      font-style: italic;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #chat-title.has-title {
      color: #111827;
      font-style: normal;
    }

    .server-badge {
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: #f3f4f6;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      margin-left: 12px;
      flex-shrink: 0;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 3px; }

    /* Empty state */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding-bottom: 60px;
    }

    #empty-state h2 {
      font-size: 19px;
      font-weight: 500;
      color: #374151;
    }

    #empty-state p {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      max-width: 380px;
    }

    .sample-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 6px;
      width: 100%;
      max-width: 480px;
    }

    .sample-btn {
      padding: 10px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #fff;
      color: #374151;
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.12s, background 0.12s;
    }
    .sample-btn:hover { border-color: #9ca3af; background: #f9fafb; }

    /* Message row */
    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 30px; height: 30px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-row.user .msg-avatar   { background: #111827; color: #fff; }
    .msg-row.assistant .msg-avatar { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }

    .msg-body { flex: 1; }
    .msg-row.user .msg-body { display: flex; justify-content: flex-end; }

    .msg-bubble {
      padding: 11px 15px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
    }
    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      color: #111827;
      max-width: 72%;
    }
    .msg-row.assistant .msg-bubble {
      background: #fff;
      border: 1px solid #e5e7eb;
      width: 100%;
    }

    /* Markdown inside bubbles */
    .msg-bubble p { margin-bottom: 9px; }
    .msg-bubble p:last-child { margin-bottom: 0; }
    .msg-bubble strong, .msg-bubble b { font-weight: 600; }
    .msg-bubble em { font-style: italic; }
    .msg-bubble ul, .msg-bubble ol { padding-left: 20px; margin-bottom: 9px; }
    .msg-bubble li { margin-bottom: 3px; }
    .msg-bubble h1 { font-size: 16px; font-weight: 600; margin: 4px 0 7px; }
    .msg-bubble h2 { font-size: 15px; font-weight: 600; margin: 4px 0 6px; }
    .msg-bubble h3 { font-size: 14px; font-weight: 600; margin: 4px 0 5px; }
    .msg-bubble code {
      background: #f5f5f5;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'SF Mono', 'Consolas', monospace;
      font-size: 12.5px;
    }
    .msg-bubble pre {
      background: #f8f8f8;
      border: 1px solid #e5e7eb;
      padding: 11px 13px;
      border-radius: 6px;
      overflow-x: auto;
      margin-bottom: 9px;
      font-size: 12.5px;
    }
    .msg-bubble pre code { background: none; padding: 0; }
    .msg-bubble blockquote {
      border-left: 3px solid #d1d5db;
      padding-left: 12px;
      color: #6b7280;
      margin-bottom: 9px;
    }
    .msg-bubble table {
      border-collapse: collapse;
      width: 100%;
      margin-bottom: 9px;
      font-size: 13px;
    }
    .msg-bubble th, .msg-bubble td {
      border: 1px solid #e5e7eb;
      padding: 6px 10px;
      text-align: left;
    }
    .msg-bubble th { background: #f9fafb; font-weight: 600; }
    .msg-bubble hr { border: none; border-top: 1px solid #e5e7eb; margin: 10px 0; }

    /* Streaming cursor */
    .streaming::after {
      content: '▋';
      animation: blink 0.9s infinite;
      font-size: 13px;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    /* ──────────────── INPUT AREA ──────────────── */
    #input-area {
      padding: 14px 24px 18px;
      border-top: 1px solid var(--msg-border);
      background: #fff;
    }

    .settings-row {
      display: flex;
      gap: 20px;
      margin-bottom: 11px;
      align-items: center;
      flex-wrap: wrap;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .setting-item label {
      font-size: 11px;
      color: #9ca3af;
      white-space: nowrap;
    }

    .setting-item input[type="range"] {
      width: 76px;
      accent-color: #374151;
      cursor: pointer;
      height: 3px;
    }

    .setting-val {
      font-size: 11px;
      color: #6b7280;
      min-width: 32px;
      font-variant-numeric: tabular-nums;
    }

    .input-row {
      display: flex;
      gap: 9px;
      align-items: flex-end;
    }

    #msg-input {
      flex: 1;
      padding: 10px 13px;
      border: 1px solid var(--input-border);
      border-radius: 8px;
      font-size: 14px;
      font-family: var(--font);
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 180px;
      line-height: 1.55;
      transition: border-color 0.15s;
      color: #111827;
    }
    #msg-input:focus { border-color: #9ca3af; }
    #msg-input::placeholder { color: #9ca3af; }

    #send-btn {
      padding: 0 18px;
      height: 44px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s;
    }
    #send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    #send-btn:disabled { background: #d1d5db; cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: #d1d5db;
      text-align: center;
      margin-top: 7px;
    }
  </style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<aside id="sidebar">
  <div class="sidebar-top">
    <div class="app-name">Triage RAG</div>
    <div class="app-sub">응급의료 AI 어시스턴트</div>
  </div>

  <div class="server-block">
    <div class="block-label">서버</div>
    <select id="server-select" onchange="onServerChange()">
      <option value="http://localhost:8081">:8081 — triage_rag</option>
      <option value="http://localhost:8082">:8082 — triage_rag_pageindex</option>
      <option value="http://localhost:8083" selected>:8083 — triage_rag_agent</option>
      <option value="custom">직접 입력...</option>
    </select>
    <input type="text" id="custom-url" placeholder="http://localhost:xxxx"
      style="display:none" onchange="onCustomUrl()">
    <div class="health-row">
      <span class="health-dot" id="health-dot"></span>
      <span class="health-label" id="health-label">확인 중...</span>
    </div>
  </div>

  <button id="new-chat-btn" onclick="newChat()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    새 대화
  </button>

  <div class="conv-section-label">대화 목록</div>
  <div id="conv-list"></div>

  <div class="sidebar-footer">
    <button class="export-btn" onclick="exportJSON()">JSON</button>
    <button class="export-btn" onclick="exportMarkdown()">Markdown</button>
  </div>
</aside>

<!-- ── MAIN ── -->
<main id="main">
  <div id="chat-header">
    <div id="chat-title">새 대화를 시작하세요</div>
    <span class="server-badge" id="server-badge">:8082</span>
  </div>

  <div id="messages">
    <div id="empty-state">
      <h2>Triage RAG Playground</h2>
      <p>응급환자 정보를 입력하면 KTAS 등급과 처치 프로토콜을 제공합니다.</p>
      <div class="sample-list">
        <button class="sample-btn" onclick="useSample(this)">57세 남성, 흉통 8/10점, 혈압 90/60, 맥박 120회</button>
        <button class="sample-btn" onclick="useSample(this)">말벌에 쏘였어, 알레르기 반응 의심</button>
        <button class="sample-btn" onclick="useSample(this)">30세 여성, 교통사고 후 의식저하, GCS 9</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="settings-row">
      <div class="setting-item">
        <label>Temperature</label>
        <input type="range" id="s-temp" min="0.1" max="1.0" step="0.05" value="0.2"
          oninput="document.getElementById('v-temp').textContent=parseFloat(this.value).toFixed(2)">
        <span class="setting-val" id="v-temp">0.20</span>
      </div>
      <div class="setting-item">
        <label>Top-p</label>
        <input type="range" id="s-topp" min="0.1" max="1.0" step="0.05" value="0.7"
          oninput="document.getElementById('v-topp').textContent=parseFloat(this.value).toFixed(2)">
        <span class="setting-val" id="v-topp">0.70</span>
      </div>
      <div class="setting-item">
        <label>Max tokens</label>
        <input type="range" id="s-maxt" min="256" max="1024" step="128" value="1024"
          oninput="document.getElementById('v-maxt').textContent=this.value">
        <span class="setting-val" id="v-maxt">1024</span>
      </div>
    </div>
    <div class="input-row">
      <textarea id="msg-input" rows="1"
        placeholder="환자 정보 또는 질문을 입력하세요... (Shift+Enter: 줄바꿈)"
        onkeydown="onKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="send()">전송</button>
    </div>
    <div class="input-hint">Enter: 전송 &nbsp;|&nbsp; Shift+Enter: 줄바꿈</div>
  </div>
</main>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let sessions = {};
let currentId = null;
let streaming = false;
let serverUrl = 'http://localhost:8082';

marked.setOptions({ breaks: true, gfm: true });

// ── Init ──────────────────────────────────────────────────────────────────────
(function init() {
  try { sessions = JSON.parse(localStorage.getItem('triage_sessions') || '{}'); } catch { sessions = {}; }
  renderList();
  updateBadge();
  checkHealth();
  setInterval(checkHealth, 15000);
})();

// ── Storage ───────────────────────────────────────────────────────────────────
function save() { localStorage.setItem('triage_sessions', JSON.stringify(sessions)); }

// ── Session ───────────────────────────────────────────────────────────────────
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function newChat() {
  currentId = uuid();
  sessions[currentId] = { id: currentId, title: '새 대화', server: serverUrl, messages: [], createdAt: Date.now() };
  save();
  renderList();
  renderMessages();
  setTitle(null);
  document.getElementById('msg-input').focus();
}

function loadSession(id) {
  currentId = id;
  const s = sessions[id];
  if (!s) return;
  serverUrl = s.server;
  syncServerSelect();
  updateBadge();
  checkHealth();
  renderMessages();
  renderList();
  setTitle(s.title);
}

function deleteSession(id, e) {
  e.stopPropagation();
  if (!confirm('이 대화를 삭제하겠습니까?')) return;
  delete sessions[id];
  save();
  if (currentId === id) {
    currentId = null;
    renderMessages();
    setTitle(null);
  }
  renderList();
}

// ── Sidebar list ──────────────────────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('conv-list');
  const list = Object.values(sessions).sort((a, b) => b.createdAt - a.createdAt);
  if (!list.length) {
    el.innerHTML = '<div style="padding:10px 12px;font-size:12px;color:#4a4a4e;">대화가 없습니다</div>';
    return;
  }

  const now = Date.now();
  const groups = { '오늘': [], '어제': [], '최근 7일': [], '이전': [] };
  list.forEach(s => {
    const d = Math.floor((now - s.createdAt) / 86400000);
    const g = d === 0 ? '오늘' : d === 1 ? '어제' : d <= 7 ? '최근 7일' : '이전';
    groups[g].push(s);
  });

  let html = '';
  ['오늘', '어제', '최근 7일', '이전'].forEach(g => {
    if (!groups[g].length) return;
    html += `<div class="conv-date-label">${g}</div>`;
    groups[g].forEach(s => {
      const active = s.id === currentId ? ' active' : '';
      const srv = s.server.replace('http://localhost:', ':');
      html += `<div class="conv-item${active}" onclick="loadSession('${s.id}')">
        <div class="conv-item-title" title="${esc(s.title)}">${esc(s.title)}</div>
        <div class="conv-item-server">${srv}</div>
        <button class="conv-del" onclick="deleteSession('${s.id}',event)" title="삭제">×</button>
      </div>`;
    });
  });
  el.innerHTML = html;
}

// ── Messages ──────────────────────────────────────────────────────────────────
function renderMessages() {
  const el = document.getElementById('messages');
  const s = sessions[currentId];
  if (!s || !s.messages.length) {
    el.innerHTML = emptyStateHTML();
    return;
  }
  el.innerHTML = '';
  s.messages.forEach(m => el.appendChild(msgEl(m.role, m.content)));
  scrollBottom();
}

function emptyStateHTML() {
  return `<div id="empty-state">
    <h2>Triage RAG Playground</h2>
    <p>응급환자 정보를 입력하면 KTAS 등급과 처치 프로토콜을 제공합니다.</p>
    <div class="sample-list">
      <button class="sample-btn" onclick="useSample(this)">57세 남성, 흉통 8/10점, 혈압 90/60, 맥박 120회</button>
      <button class="sample-btn" onclick="useSample(this)">말벌에 쏘였어, 알레르기 반응 의심</button>
      <button class="sample-btn" onclick="useSample(this)">30세 여성, 교통사고 후 의식저하, GCS 9</button>
    </div>
  </div>`;
}

function msgEl(role, content) {
  const div = document.createElement('div');
  div.className = `msg-row ${role}`;
  const avatar = role === 'user' ? 'U' : 'AI';
  const bubble = role === 'assistant'
    ? md(content)
    : `<p>${esc(content).replace(/\n/g, '<br>')}</p>`;
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-body"><div class="msg-bubble">${bubble}</div></div>`;
  return div;
}

function md(text) {
  const fixed = text
    .replace(/\\n/g, '\n')
    .replace(/\\t/g, '\t')
    .replace(/\\"/g, '"');
  return marked.parse(fixed);
}

function scrollBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function send() {
  if (streaming) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  if (!currentId) newChat();

  input.value = '';
  autoResize(input);

  const s = sessions[currentId];
  s.server = serverUrl;
  s.messages.push({ role: 'user', content: text });

  if (s.messages.filter(m => m.role === 'user').length === 1) {
    s.title = text.length > 42 ? text.slice(0, 42) + '…' : text;
    setTitle(s.title);
  }

  save();
  renderList();

  // Render user message + placeholder
  const msgsEl = document.getElementById('messages');
  msgsEl.innerHTML = '';
  s.messages.forEach(m => msgsEl.appendChild(msgEl(m.role, m.content)));

  const placeholder = document.createElement('div');
  placeholder.className = 'msg-row assistant';
  placeholder.innerHTML = `
    <div class="msg-avatar">AI</div>
    <div class="msg-body"><div class="msg-bubble streaming" id="streaming-bubble"></div></div>`;
  msgsEl.appendChild(placeholder);
  scrollBottom();

  streaming = true;
  document.getElementById('send-btn').disabled = true;

  const bubble = document.getElementById('streaming-bubble');
  let full = '';

  try {
    const res = await fetch(`${serverUrl}/generate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: s.messages.map(m => ({ role: m.role, content: m.content })),
        use_knowledge_base: true,
        temperature: parseFloat(document.getElementById('s-temp').value),
        top_p: parseFloat(document.getElementById('s-topp').value),
        max_tokens: parseInt(document.getElementById('s-maxt').value),
        session_id: currentId
      })
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const parsed = JSON.parse(data);
          if (parsed?.choices?.[0]?.finish_reason === '[DONE]') continue;
          const chunk = parsed?.choices?.[0]?.message?.content
                     ?? parsed?.choices?.[0]?.delta?.content
                     ?? '';
          if (chunk) {
            full += chunk;
            bubble.innerHTML = md(full);
            bubble.classList.add('streaming');
            scrollBottom();
          }
        } catch {}
      }
    }
  } catch (err) {
    full = `오류: ${err.message}`;
    bubble.innerHTML = `<p style="color:#ef4444">${esc(full)}</p>`;
  }

  bubble.classList.remove('streaming');
  s.messages.push({ role: 'assistant', content: full });
  save();

  streaming = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('msg-input').focus();
}

// ── Server ────────────────────────────────────────────────────────────────────
function onServerChange() {
  const sel = document.getElementById('server-select');
  const custom = document.getElementById('custom-url');
  if (sel.value === 'custom') {
    custom.style.display = 'block';
    custom.focus();
  } else {
    custom.style.display = 'none';
    serverUrl = sel.value;
    updateBadge();
    checkHealth();
  }
}

function onCustomUrl() {
  const v = document.getElementById('custom-url').value.trim();
  if (v) { serverUrl = v; updateBadge(); checkHealth(); }
}

function syncServerSelect() {
  const sel = document.getElementById('server-select');
  const opts = Array.from(sel.options);
  const match = opts.find(o => o.value === serverUrl);
  if (match) {
    sel.value = serverUrl;
    document.getElementById('custom-url').style.display = 'none';
  } else {
    sel.value = 'custom';
    document.getElementById('custom-url').style.display = 'block';
    document.getElementById('custom-url').value = serverUrl;
  }
}

function updateBadge() {
  document.getElementById('server-badge').textContent = serverUrl.replace('http://localhost', '');
}

async function checkHealth() {
  const dot = document.getElementById('health-dot');
  const lbl = document.getElementById('health-label');
  try {
    const res = await fetch(`${serverUrl}/health`, { signal: AbortSignal.timeout(3000) });
    if (res.ok) { dot.className = 'health-dot ok'; lbl.textContent = '서버 정상'; }
    else throw new Error();
  } catch {
    dot.className = 'health-dot err';
    lbl.textContent = '서버 오프라인';
  }
}

// ── Export ────────────────────────────────────────────────────────────────────
function exportJSON() {
  const s = sessions[currentId];
  if (!s) { alert('대화를 선택하세요.'); return; }
  dl(new Blob([JSON.stringify(s, null, 2)], { type: 'application/json' }),
    `${s.title}_${fmtDate(s.createdAt)}.json`);
}

function exportMarkdown() {
  const s = sessions[currentId];
  if (!s) { alert('대화를 선택하세요.'); return; }
  let txt = `# ${s.title}\n날짜: ${new Date(s.createdAt).toLocaleString('ko-KR')}\n서버: ${s.server}\n\n---\n\n`;
  s.messages.forEach(m => {
    const role = m.role === 'user' ? '**[사용자]**' : '**[AI]**';
    txt += `${role}\n\n${m.content.replace(/\\n/g, '\n')}\n\n---\n\n`;
  });
  dl(new Blob([txt], { type: 'text/markdown' }),
    `${s.title}_${fmtDate(s.createdAt)}.md`);
}

function dl(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[/\\?%*:|"<>]/g, '_');
  a.click();
  URL.revokeObjectURL(a.href);
}

function fmtDate(ts) { return new Date(ts).toISOString().slice(0, 10); }

// ── Helpers ───────────────────────────────────────────────────────────────────
function setTitle(t) {
  const el = document.getElementById('chat-title');
  if (t) { el.textContent = t; el.className = 'has-title'; }
  else { el.textContent = '새 대화를 시작하세요'; el.className = ''; }
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}

function useSample(btn) {
  const inp = document.getElementById('msg-input');
  inp.value = btn.textContent;
  autoResize(inp);
  inp.focus();
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
