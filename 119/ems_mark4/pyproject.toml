[project]
name = "ems-mark4"
version = "0.1.0"
description = "AI EMS Commander — mark4 (Direct Access, 병원 DB 제거) 배포판"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
ems-mark4-server = "ems_mark4.server:main"
ems-mark4-cli = "ems_mark4.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ems_mark4"]
