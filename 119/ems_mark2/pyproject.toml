[project]
name = "ems-mark2"
version = "0.1.0"
description = "AI EMS Commander — mark2 (Long-Context) 배포판"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
    "pypdf>=4.0.0",
]

[project.scripts]
ems-mark2-server = "ems_mark2.server:main"
ems-mark2-cli = "ems_mark2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ems_mark2"]
