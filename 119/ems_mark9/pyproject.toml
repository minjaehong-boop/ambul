[project]
name = "ems-commander"
version = "0.1.0"
description = "AI EMS Commander — LLM 기반 119 구급대원 현장 처치 보조 시스템 (mark11 배포판)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "anyio>=4.0.0",
]

[project.scripts]
ems-server = "ems_commander.server:main"
ems-cli = "ems_commander.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ems_commander"]
