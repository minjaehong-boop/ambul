[project]
name = "ems-mark1"
version = "0.1.0"
description = "AI EMS Commander — mark1 (Vector RAG) 배포판"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "pypdf>=4.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
ems-mark1-server = "ems_mark1.server:main"
ems-mark1-cli = "ems_mark1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ems_mark1"]
