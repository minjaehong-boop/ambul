[project]
name = "ems-mark3"
version = "0.1.0"
description = "AI EMS Commander — mark3 (Direct Access) 배포판"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
ems-mark3-server = "ems_mark3.server:main"
ems-mark3-cli = "ems_mark3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ems_mark3"]
